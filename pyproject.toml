[project]
name = "doclinglibx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ben Shore", email = "jobs_raceway0p@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.123.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.uv]
# docling/docling-core pin transformers<5.9.0; force the patched version for
# GHSA-xrqw-3rrv-vx5w (CVE-2026-9856, path traversal in save_pretrained()).
# Verify docling's OCR/VLM/chunking paths still work whenever docling is upgraded.
override-dependencies = ["transformers>=5.10.0"]
